name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . ruff
      - run: python -m pytest -q
      - run: python -m ruff check backend/api/authorization.py backend/api/routes/pipeline.py backend/api/routes/providers.py backend/api/routes/demos.py backend/workers backend/core/secrets.py backend/core/ssrf.py backend/domain/identity.py backend/infrastructure/providers backend/infrastructure/persistence/platform_repository.py backend/infrastructure/persistence/sqlite_import.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
