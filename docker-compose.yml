services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ashencrm
      POSTGRES_PASSWORD: ashencrm
      POSTGRES_DB: ashencrm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashencrm"]
      interval: 5s
      timeout: 5s
      retries: 10
